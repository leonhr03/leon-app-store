<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="Leon AppStore">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path
          d="M6.5 8h11l-1 11.5h-9L6.5 8Z"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <path d="M9.5 8a2.5 2.5 0 0 1 5 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </a>

    <nav class="nav">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Entdecken</a>
      <a routerLink="/newApp" routerLinkActive="is-active">Neue App</a>
    </nav>

    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6" />
        <path d="m20 20-4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      <input
        type="search"
        placeholder="Suchen"
        aria-label="Suchen"
        [ngModel]="search.query()"
        (ngModelChange)="search.query.set($event)"
      />
    </label>
  </div>
</header>
