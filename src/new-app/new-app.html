<app-header />

<main class="page">
  <section class="hero">
    <h1>Neue App veröffentlichen</h1>
    <p class="subhead">Füge Icon und App-Datei hinzu und ergänze die Details.</p>
  </section>

  <form class="publish-card" (ngSubmit)="deployApp()">
    <div class="upload-grid">
      <div class="field-block">
        <p class="block-heading">App-Icon</p>
        <div class="icon-row">
          <div class="icon-preview">
            @if (iconSrc) {
              <img [src]="iconSrc" alt="Ausgewähltes Icon" />
            } @else {
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="4" y="4" width="16" height="16" rx="4" stroke="currentColor" stroke-width="1.4" />
                <circle cx="9.5" cy="9.5" r="1.4" fill="currentColor" />
                <path d="m5 17 4.5-4.5 3 3L16 12l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            }
          </div>
          <div class="icon-actions">
            <button type="button" class="secondary-button" (click)="iconInput.click()">Icon wählen</button>
            <span class="hint">PNG, quadratisch empfohlen</span>
          </div>
        </div>
        <input #iconInput type="file" hidden (change)="onIconFileSelected($event)" accept=".png" />
      </div>

      <div class="field-block">
        <p class="block-heading">App-Datei</p>
        <div class="dropzone">
          <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 16V6m0 0L8 10m4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M5 18h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          @if (appPackageName) {
            <p class="file-name">{{ appPackageName }}</p>
          } @else {
            <p class="dropzone-text">Keine Datei ausgewählt</p>
          }
          <button type="button" class="secondary-button" (click)="fileInput.click()">Datei wählen</button>
        </div>
        <input #fileInput type="file" hidden (change)="onAppFileSelected($event)" accept=".apk" />
      </div>
    </div>

    <div class="form">
      <label class="input-group">
        <span class="input-label">App-Name</span>
        <input name="name" placeholder="z. B. Meine App" [(ngModel)]="name" />
      </label>

      <label class="input-group">
        <span class="input-label">Version</span>
        <input name="version" placeholder="z. B. 1.0.0" [(ngModel)]="version" />
      </label>

      <label class="input-group">
        <span class="input-label">Beschreibung</span>
        <textarea name="description" placeholder="Worum geht es in deiner App?" rows="6" [(ngModel)]="description"></textarea>
      </label>

      @if (errorMessage) {
        <p class="error-message">{{ errorMessage }}</p>
      }

      <button type="submit" class="deploy-button" [disabled]="isDeploying">
        {{ isDeploying ? 'Wird veröffentlicht…' : 'Veröffentlichen' }}
      </button>
    </div>
  </form>
</main>
